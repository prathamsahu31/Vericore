[project]
name = "vericore-backend"
version = "0.1.0"
description = "Bid compliance verification for GeM procurement — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.17",
    # Native-text PDF extraction with coordinates (CLAUDE.md §3).
    "pymupdf>=1.24",
    # Fuzzy matching for the evidence locator and name comparison (§3, §9).
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "black>=24.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated artefacts; their long enum literals are not worth
# reflowing, and the local enum bindings read better upper-case.
"alembic/versions/*.py" = ["E501", "N806"]
"alembic/env.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
